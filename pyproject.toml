[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airflow-rocrate"
version = "0.1.0"
description = "Automated RO-Crate reproducibility package generator for Apache Airflow DAGs"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Akbar"},
]
keywords = ["airflow", "reproducibility", "rocrate", "provenance", "data-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "apache-airflow>=3.2.1",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "rocrate>=0.9.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "mypy>=1.4.0",
]

[project.scripts]
airflow-rocrate = "airflow_rocrate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/airflow_rocrate"]
